<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cameron the Capitol Cat</title>
<meta name="description" content="A Flappy Bird style game starring Cameron, the Nebraska State Capitol cat.">
<meta name="theme-color" content="#2b1f16">
<link rel="icon" href="cameron.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b1f16;
    --outline: #3b2a1d;
    --stone: #dcc79f;
    --stone-light: #f1e5c8;
    --gold: #d9a441;
    --gold-glow: #f5dc93;
    --terracotta: #a8553a;
    --teal: #3f6f7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Press Start 2P", ui-monospace, monospace;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: relative;
    height: min(100dvh, calc(100vw * 16 / 9));
    width: min(100vw, calc(100dvh * 9 / 16));
    touch-action: none;
    cursor: pointer;
    box-shadow: 0 0 0 4px var(--outline), 0 0 60px rgba(245, 220, 147, .15);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.5%;
    padding: 6%;
    text-align: center;
    pointer-events: none;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--stone-light);
    border: 4px solid var(--outline);
    box-shadow: inset 0 0 0 3px var(--gold), 6px 6px 0 rgba(43, 31, 22, .55);
    padding: 1.4em 1.2em;
    width: 88%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1em;
    pointer-events: auto;
  }
  .title {
    font-size: clamp(14px, 4.6vmin, 24px);
    line-height: 1.35;
    color: var(--terracotta);
    text-shadow: 2px 2px 0 var(--gold-glow);
    margin: 0;
  }
  .title small {
    display: block;
    font-size: .55em;
    color: var(--outline);
    text-shadow: none;
    margin-top: .5em;
  }
  .avatar {
    width: 38%;
    height: auto;
    aspect-ratio: 1;
    flex-shrink: 0;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--outline);
    box-shadow: 0 0 0 3px var(--gold);
  }
  p {
    margin: 0;
    font-size: clamp(8px, 2.4vmin, 12px);
    line-height: 1.7;
  }
  .muted { color: #6b5238; }
  .scores {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .6em;
    width: 100%;
  }
  .scores div {
    background: var(--stone);
    border: 3px solid var(--outline);
    padding: .6em .2em;
    font-size: clamp(7px, 2vmin, 10px);
    color: #6b5238;
  }
  .scores strong {
    display: block;
    margin-top: .5em;
    font-size: clamp(14px, 4.4vmin, 22px);
    color: var(--ink);
  }
  .rank {
    color: var(--teal);
    font-size: clamp(8px, 2.4vmin, 12px);
  }
  .new-best { color: var(--terracotta); }
  button {
    font: inherit;
    font-size: clamp(9px, 2.6vmin, 13px);
    color: var(--ink);
    background: var(--gold);
    border: 3px solid var(--outline);
    box-shadow: inset 0 -4px 0 #a97a26, 3px 3px 0 var(--outline);
    padding: .9em 1.4em;
    cursor: pointer;
  }
  button:active { transform: translate(2px, 2px); box-shadow: inset 0 -4px 0 #a97a26, 1px 1px 0 var(--outline); }
  #hint p {
    color: var(--stone-light);
    text-shadow: 2px 2px 0 var(--outline);
    margin-top: 40%;
  }
  #mute {
    position: absolute;
    top: 2.5%;
    right: 3%;
    padding: .5em .6em;
    font-size: clamp(8px, 2.2vmin, 11px);
    box-shadow: inset 0 -3px 0 #a97a26, 2px 2px 0 var(--outline);
    z-index: 2;
  }
  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>
<div id="game" aria-label="Cameron the Capitol Cat game">
  <canvas id="c" width="288" height="512"></canvas>

  <div class="overlay" id="start">
    <div class="card">
      <h1 class="title">Cameron<small>the Capitol Cat</small></h1>
      <img class="avatar" src="cameron.jpg" alt="Cameron, a brown tabby cat, lounging on a limestone ledge">
      <p>Leap Cameron between the columns of the Capitol.</p>
      <p class="muted blink">Tap, click, or press Space</p>
      <p class="muted" id="startBest"></p>
    </div>
  </div>

  <div class="overlay" id="hint" hidden>
    <p class="blink">Tap to jump</p>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card">
      <h2 class="title">Nap time!<small id="quip"></small></h2>
      <img class="avatar" src="cameron.jpg" alt="">
      <div class="scores">
        <div>Score<strong id="finalScore">0</strong></div>
        <div>Best<strong id="finalBest">0</strong></div>
      </div>
      <p class="rank" id="rank"></p>
      <button id="again" type="button">Play again</button>
    </div>
  </div>

  <button id="mute" type="button" aria-label="Toggle sound">Sound: on</button>
</div>

<script>
(() => {
  'use strict';

  // ---------- Setup ----------
  const W = 288, H = 512, FLOOR = H - 72;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const $ = id => document.getElementById(id);
  const ui = {
    game: $('game'), start: $('start'), hint: $('hint'), over: $('over'),
    startBest: $('startBest'), finalScore: $('finalScore'), finalBest: $('finalBest'),
    rank: $('rank'), quip: $('quip'), again: $('again'), mute: $('mute'),
  };

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const C = {
    outline: '#3b2a1d',
    stone: '#dcc79f', stoneLight: '#eadbb8', stoneLighter: '#f3e8cf', stoneShade: '#bfa378', stoneDark: '#a88c63',
    gold: '#d9a441', goldGlow: '#f5dc93', goldDark: '#a97a26',
    brick: '#b98f5a', brickLine: '#9c7446',
    terracotta: '#a8553a',
    teal: '#3f6f7a', tealLight: '#8fb7ae',
    green: '#6f8f4e', greenDark: '#56733b',
    marbleA: '#efe5d1', marbleB: '#c9b596', grout: '#9c8566',
  };

  const mk = (w, h) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    return [c, x];
  };

  // ---------- Cameron sprite (pixel art) ----------
  const PAL = {
    k: '#2b2118', // outline
    b: '#8a7355', // tabby base
    d: '#4a3a2a', // stripes
    l: '#d2b184', // tan belly
    w: '#f1e8d8', // white chin / paws
    g: '#a9c46e', // green eyes
    p: '#d99a8a', // pink ears / nose
  };
  const FRAMES = [
    [ // legs stretched (leaping)
      '.................k...k....',
      '................kpk.kpk...',
      '.kk.............kbbkbbk...',
      'kbbk...........kbdbdbdbk..',
      'kdbk...........kbbbbbbbbk.',
      '.kdbk.........kbgkbbbgkbk.',
      '..kbk.........kbggbbbggbk.',
      '..kdbkkkkkkkkkbbbbbpbbbbbk',
      '...kbdbbdbbdbbbwwbkbwwbbk.',
      '...kbbdbbdbbdbbbwwwwwbkk..',
      '..kbdbbdbbdbbdbbbbbbbk....',
      '.kbbklllllllllllkbbbbbk...',
      'kbbk.kkkkkkkkkkk.kkbbbbk..',
      'kwk................kkkwwk.',
      '.k...................kkk..',
    ],
    [ // legs tucked
      '.................k...k....',
      '................kpk.kpk...',
      '................kbbkbbk...',
      '...............kbdbdbdbk..',
      '.kk............kbbbbbbbbk.',
      'kbbk..........kbgkbbbgkbk.',
      'kdbk..........kbggbbbggbk.',
      '.kdbkkkkkkkkkkbbbbbpbbbbbk',
      '..kbdbbdbbdbbbbwwbkbwwbbk.',
      '...kbbdbbdbbdbbbwwwwwbkk..',
      '...kbdbbdbbdbbdbbbbbbk....',
      '...kbllllllllllllbbbk.....',
      '...kbbkkkkkkkkkkkbbk......',
      '...kwwk.........kwwk......',
      '....kk...........kk.......',
    ],
    [ // landed on all four feet
      '.................k...k....',
      '................kpk.kpk...',
      '.k..............kbbkbbk...',
      'kbk............kbdbdbdbk..',
      'kdk............kbbbbbbbbk.',
      'kbk...........kbgkbbbgkbk.',
      '.kbk..........kbggbbbggbk.',
      '..kbkkkkkkkkkkbbbbbpbbbbbk',
      '..kbdbbdbbdbbbbwwbkbwwbbk.',
      '..kbbdbbdbbdbbbbwwwwwbkk..',
      '..kbdbbdbbdbbdbbbbbbbk....',
      '..kbllllllllllllbbbbk.....',
      '..kbbkkbbkkkkbbkkbbk......',
      '..kbbkkbbk..kbbkkbbk......',
      '..kwwkkwwk..kwwkkwwk......',
    ],
  ];
  const catSprites = FRAMES.map(rows => {
    const w = Math.max(...rows.map(r => r.length));
    const [c, x] = mk(w, rows.length);
    rows.forEach((row, y) => {
      [...row].forEach((ch, i) => {
        if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i, y, 1, 1); }
      });
    });
    return c;
  });
  const CAT_W = catSprites[0].width, CAT_H = catSprites[0].height, CAT_SCALE = 1.5;

  // ---------- Background: Capitol arcade ----------
  const BAY = 96, TILE = BAY * 2;
  const bg = (() => {
    const [c, x] = mk(TILE, FLOOR);
    // limestone wall
    x.fillStyle = C.stone; x.fillRect(0, 0, TILE, FLOOR);
    // ashlar block joints
    x.fillStyle = '#cdb68b';
    for (let y = 44, row = 0; y < 380; y += 14, row++) {
      x.fillRect(0, y, TILE, 1);
      for (let bx = (row % 2) * 16; bx < TILE; bx += 32) x.fillRect(bx, y, 1, 14);
    }
    // vaulted brick ceiling
    x.fillStyle = C.brick; x.fillRect(0, 0, TILE, 36);
    x.fillStyle = C.brickLine;
    for (let y = 0, row = 0; y < 36; y += 4, row++) {
      x.fillRect(0, y, TILE, 1);
      for (let bx = (row % 2) * 4; bx < TILE; bx += 8) x.fillRect(bx, y, 1, 4);
    }
    x.fillStyle = C.gold; x.fillRect(0, 36, TILE, 3);
    x.fillStyle = C.outline; x.fillRect(0, 39, TILE, 1);
    // wainscot
    x.fillStyle = '#c9ad84'; x.fillRect(0, 380, TILE, FLOOR - 380);
    x.fillStyle = C.gold; x.fillRect(0, 380, TILE, 2);
    x.fillStyle = C.stoneDark;
    for (let px = 8; px < TILE; px += 48) {
      x.strokeStyle = C.stoneDark; x.lineWidth = 1;
      x.strokeRect(px + 0.5, 392.5, 32, 34);
    }

    for (let i = 0; i < 2; i++) {
      const bx = i * BAY;
      const cx = bx + 55, spring = 150, r = 33, bottom = 350;
      // voussoir ring
      x.fillStyle = C.stoneLight;
      x.beginPath(); x.arc(cx, spring, r + 7, Math.PI, 0); x.lineTo(cx + r + 7, bottom); x.lineTo(cx - r - 7, bottom); x.fill();
      x.strokeStyle = C.stoneShade; x.lineWidth = 1;
      for (let a = 0; a <= 12; a++) {
        const t = Math.PI + (a / 12) * Math.PI;
        x.beginPath();
        x.moveTo(cx + Math.cos(t) * r, spring + Math.sin(t) * r);
        x.lineTo(cx + Math.cos(t) * (r + 7), spring + Math.sin(t) * (r + 7));
        x.stroke();
      }
      // opening
      x.save();
      x.beginPath(); x.arc(cx, spring, r, Math.PI, 0); x.lineTo(cx + r, bottom); x.lineTo(cx - r, bottom); x.closePath();
      x.clip();
      if (i === 0) {
        // glowing arched window
        const g = x.createLinearGradient(0, spring - r, 0, bottom);
        g.addColorStop(0, '#fff3cc'); g.addColorStop(1, '#e9c46a');
        x.fillStyle = g; x.fillRect(cx - r, spring - r, r * 2, bottom - spring + r);
        x.fillStyle = '#6b5238';
        for (let mx = -22; mx <= 22; mx += 11) x.fillRect(cx + mx, spring - r, 2, bottom - spring + r);
        for (let my = spring - 20; my < bottom; my += 20) x.fillRect(cx - r, my, r * 2, 2);
      } else {
        // mural: sky over the plains
        const g = x.createLinearGradient(0, spring - r, 0, bottom);
        g.addColorStop(0, C.teal); g.addColorStop(0.7, C.tealLight); g.addColorStop(1, '#d8cf9e');
        x.fillStyle = g; x.fillRect(cx - r, spring - r, r * 2, bottom - spring + r);
        x.fillStyle = C.goldGlow; x.beginPath(); x.arc(cx + 12, spring + 10, 8, 0, Math.PI * 2); x.fill();
        x.fillStyle = C.green; x.beginPath(); x.ellipse(cx - 14, bottom + 10, 45, 55, 0, 0, Math.PI * 2); x.fill();
        x.fillStyle = C.greenDark; x.beginPath(); x.ellipse(cx + 26, bottom + 20, 40, 50, 0, 0, Math.PI * 2); x.fill();
        x.fillStyle = C.gold;
        for (let fy = bottom - 34; fy < bottom; fy += 6) x.fillRect(cx - 30, fy, 26, 1);
        // sower silhouette (a nod to the tower statue)
        x.fillStyle = C.outline;
        x.fillRect(cx - 4, bottom - 70, 4, 14);
        x.fillRect(cx - 3, bottom - 75, 3, 4);
        x.fillRect(cx - 6, bottom - 56, 2, 8); x.fillRect(cx - 1, bottom - 56, 2, 8);
        x.fillRect(cx, bottom - 68, 6, 2);
      }
      x.restore();
      // gold arch trim
      x.strokeStyle = C.gold; x.lineWidth = 2;
      x.beginPath(); x.arc(cx, spring, r, Math.PI, 0); x.stroke();
      x.fillStyle = C.gold; x.fillRect(cx - r - 1, spring, 2, bottom - spring); x.fillRect(cx + r - 1, spring, 2, bottom - spring);
      // sill
      x.fillStyle = C.stoneLighter; x.fillRect(cx - r - 6, bottom, (r + 6) * 2, 5);
      x.fillStyle = C.stoneShade; x.fillRect(cx - r - 6, bottom + 5, (r + 6) * 2, 2);
      // mosaic medallion in spandrel
      x.fillStyle = C.terracotta; x.fillRect(cx - 3, 56, 6, 6);
      x.fillStyle = C.gold; x.fillRect(cx - 1, 58, 2, 2);
      // pilaster
      x.fillStyle = C.stoneLighter; x.fillRect(bx, 40, 14, 340);
      x.fillStyle = C.stoneShade; x.fillRect(bx + 11, 40, 3, 340);
      x.fillStyle = C.stoneLight; x.fillRect(bx + 4, 50, 1, 320); x.fillRect(bx + 8, 50, 1, 320);
      x.fillStyle = C.gold; x.fillRect(bx - 2, 40, 18, 4);
    }
    // hanging lanterns
    for (let i = 0; i < 2; i++) {
      const lx = i * BAY + 7;
      x.fillStyle = C.outline; x.fillRect(lx, 39, 1, 44);
      x.fillStyle = C.gold; x.fillRect(lx - 3, 83, 7, 2);
      x.fillStyle = '#fffbe9'; x.beginPath(); x.arc(lx + 0.5, 92, 6, 0, Math.PI * 2); x.fill();
      x.strokeStyle = C.stoneShade; x.lineWidth = 1; x.stroke();
    }
    return c;
  })();

  // ---------- Marble floor ----------
  const FTILE = 24;
  const floorImg = (() => {
    const [c, x] = mk(W + FTILE * 2, H - FLOOR);
    x.fillStyle = '#7a5536'; x.fillRect(0, 0, c.width, 4);
    x.fillStyle = C.gold; x.fillRect(0, 4, c.width, 2);
    for (let tx = 0, i = 0; tx < c.width; tx += FTILE, i++) {
      for (let ty = 6, j = 0; ty < c.height; ty += FTILE, j++) {
        x.fillStyle = (i + j) % 2 ? C.marbleB : C.marbleA;
        x.fillRect(tx, ty, FTILE, FTILE);
        x.fillStyle = 'rgba(120,95,70,.18)';
        x.fillRect(tx + 5, ty + 9, 10, 1); x.fillRect(tx + 12, ty + 15, 7, 1);
        x.fillStyle = C.grout;
        x.fillRect(tx, ty, FTILE, 1); x.fillRect(tx, ty, 1, FTILE);
      }
    }
    return c;
  })();

  // ---------- Columns ----------
  const COL_W = 48, CAP_W = COL_W + 12, CAP_H = 18;
  const shaftImg = (() => {
    const [c, x] = mk(COL_W, H);
    x.fillStyle = '#e6d6b2'; x.fillRect(0, 0, COL_W, H);
    x.fillStyle = C.stoneShade;
    for (let fx = 6; fx < COL_W - 4; fx += 6) x.fillRect(fx, 0, 2, H);
    x.fillStyle = C.stoneLighter; x.fillRect(9, 0, 3, H); x.fillRect(15, 0, 1, H);
    x.fillStyle = 'rgba(120,90,55,.35)'; x.fillRect(COL_W - 10, 0, 7, H);
    x.fillStyle = C.outline; x.fillRect(0, 0, 2, H); x.fillRect(COL_W - 2, 0, 2, H);
    return c;
  })();
  const capImg = (() => { // Ionic capital, abacus at top
    const [c, x] = mk(CAP_W, CAP_H);
    const box = (px, py, w, h, fill) => {
      x.fillStyle = C.outline; x.fillRect(px, py, w, h);
      x.fillStyle = fill; x.fillRect(px + 1, py + 1, w - 2, h - 2);
    };
    box(0, 0, CAP_W, 6, C.stoneLighter);
    box(5, 5, CAP_W - 10, 8, C.stone);
    x.fillStyle = C.stoneShade;
    for (let ex = 12; ex < CAP_W - 12; ex += 6) x.fillRect(ex, 8, 3, 3);
    for (const vx of [6, CAP_W - 6]) {
      x.fillStyle = C.outline; x.beginPath(); x.arc(vx, 10, 6, 0, Math.PI * 2); x.fill();
      x.fillStyle = C.stoneLighter; x.beginPath(); x.arc(vx, 10, 5, 0, Math.PI * 2); x.fill();
      x.fillStyle = C.gold; x.beginPath(); x.arc(vx, 10, 2.5, 0, Math.PI * 2); x.fill();
      x.fillStyle = C.outline; x.fillRect(vx - 1, 9, 2, 2);
    }
    box(8, 13, CAP_W - 16, 5, C.stoneLight);
    return c;
  })();
  const baseImg = (() => {
    const [c, x] = mk(COL_W + 10, 12);
    x.fillStyle = C.outline; x.fillRect(0, 0, c.width, 12);
    x.fillStyle = C.stoneLight; x.fillRect(3, 1, c.width - 6, 4);
    x.fillStyle = C.stoneLighter; x.fillRect(1, 6, c.width - 2, 5);
    return c;
  })();

  function drawColumn(x, gapTop, gapBottom) {
    // hanging column (capital faces the gap)
    ctx.drawImage(shaftImg, 0, 0, COL_W, gapTop, x, 0, COL_W, gapTop);
    ctx.save();
    ctx.translate(x - 6, gapTop);
    ctx.scale(1, -1);
    ctx.drawImage(capImg, 0, 0);
    ctx.restore();
    // standing column
    const h = FLOOR - gapBottom;
    ctx.drawImage(shaftImg, 0, 0, COL_W, h, x, gapBottom, COL_W, h);
    ctx.drawImage(capImg, x - 6, gapBottom);
    ctx.drawImage(baseImg, x - 5, FLOOR - 12);
  }

  // ---------- Sound ----------
  let audio = null;
  let muted = store.get('cameron-muted', '0') === '1';
  const syncMute = () => { ui.mute.textContent = muted ? 'Sound: off' : 'Sound: on'; };
  syncMute();
  function tone(freq, endFreq, dur, type = 'square', vol = 0.06, delay = 0) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const t = audio.currentTime + delay;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch {}
  }
  const sfx = {
    jump: () => tone(520, 880, 0.09, 'triangle', 0.08),
    point: () => { tone(988, 988, 0.07, 'square', 0.04); tone(1319, 1319, 0.12, 'square', 0.04, 0.07); },
    hit: () => { tone(220, 60, 0.25, 'sawtooth', 0.07); },
    meow: () => { tone(700, 1100, 0.12, 'triangle', 0.06); tone(1100, 500, 0.28, 'triangle', 0.06, 0.12); },
  };

  // ---------- Game state ----------
  const GRAVITY = 1350, JUMP = -390, MAX_FALL = 560;
  const GAP = 122, SPACING = 168, CAT_X = 76;
  let state, cat, columns, score, best = +store.get('cameron-best', '0') || 0;
  let bgX = 0, floorX = 0, t = 0, deadAt = 0, flash = 0, firstRun = true;

  function reset() {
    state = 'ready';
    cat = { y: H * 0.42, vy: 0, rot: 0, frame: 0, frameT: 0 };
    columns = [];
    score = 0;
    ui.over.hidden = true;
    ui.start.hidden = !firstRun;
    ui.hint.hidden = firstRun;
    ui.startBest.textContent = best ? `Best: ${best}` : '';
  }

  function speed() { return 112 + Math.min(score, 40) * 1.1; }

  function spawnColumn(x) {
    const minTop = 60, maxTop = FLOOR - GAP - 60;
    const last = columns.length ? columns[columns.length - 1].top : (minTop + maxTop) / 2;
    // keep consecutive gaps reachable
    const lo = Math.max(minTop, last - 150), hi = Math.min(maxTop, last + 150);
    columns.push({ x, top: lo + Math.random() * (hi - lo), passed: false });
  }

  function jump() {
    cat.vy = JUMP;
    cat.frame = 0; cat.frameT = 0;
    sfx.jump();
  }

  function handleInput() {
    if (state === 'ready') {
      state = 'play';
      firstRun = false;
      ui.start.hidden = true; ui.hint.hidden = true;
      spawnColumn(W + 40);
      jump();
    } else if (state === 'play') {
      jump();
    } else if (state === 'over' && performance.now() - deadAt > 650) {
      reset();
    }
  }

  function die() {
    if (state !== 'play') return;
    state = 'dying';
    flash = 1;
    sfx.hit();
    setTimeout(sfx.meow, 180);
  }

  const RANKS = [
    [50, 'Rank: Governor'],
    [30, 'Rank: State Senator'],
    [20, 'Rank: Lobbyist'],
    [10, 'Rank: Legislative Page'],
    [5,  'Rank: Capitol Intern'],
    [0,  'Rank: Tourist'],
  ];
  const QUIPS = ['Cameron is unimpressed.', 'Back to the ledge.', 'Pets were not provided.', 'The Unicameral adjourns.', 'Sunbeam break.'];

  function gameOver() {
    state = 'over';
    deadAt = performance.now();
    const isBest = score > best;
    if (isBest) { best = score; store.set('cameron-best', String(best)); }
    ui.finalScore.textContent = score;
    ui.finalBest.textContent = best;
    ui.rank.textContent = RANKS.find(r => score >= r[0])[1];
    ui.quip.textContent = isBest && score > 0 ? 'New best!' : QUIPS[Math.floor(Math.random() * QUIPS.length)];
    ui.quip.classList.toggle('new-best', isBest && score > 0);
    ui.over.hidden = false;
  }

  // ---------- Update ----------
  function update(dt) {
    t += dt;
    const moving = state === 'ready' || state === 'play';
    if (moving) {
      const s = state === 'play' ? speed() : 90;
      bgX = (bgX + s * 0.3 * dt) % TILE;
      floorX = (floorX + s * dt) % FTILE;
    }

    // animation frames
    cat.frameT += dt;
    if (cat.landed) cat.landT += dt;
    if (cat.frameT > (state === 'ready' ? 0.28 : 0.14)) { cat.frameT = 0; cat.frame ^= 1; }

    if (state === 'ready') {
      cat.y = H * 0.42 + Math.sin(t * 4) * 6;
      cat.rot = 0;
      return;
    }

    if (state === 'play' || state === 'dying') {
      cat.vy = Math.min(cat.vy + GRAVITY * dt, MAX_FALL);
      cat.y += cat.vy * dt;
      // after a crash Cameron rights himself mid-fall, like any good cat
      const target = state === 'dying' ? 0 : cat.vy < 0 ? -0.4 : Math.min(1.35, (cat.vy / MAX_FALL) * 1.6 - 0.2);
      cat.rot += (target - cat.rot) * Math.min(1, dt * (state === 'dying' ? 10 : cat.vy < 0 ? 18 : 6));
      if (cat.y < 50) { cat.y = 50; cat.vy = 0; }
      if (cat.y + 9 >= FLOOR) {
        cat.y = FLOOR - 9;
        cat.rot = 0;
        cat.landed = true;
        cat.landT = 0;
        if (state === 'play') die();
        state = 'over-pending';
        setTimeout(gameOver, 450);
      }
    }

    if (state === 'play') {
      const s = speed();
      for (const col of columns) {
        col.x -= s * dt;
        if (!col.passed && col.x + COL_W < CAT_X - 6) {
          col.passed = true;
          score++;
          sfx.point();
        }
      }
      if (columns.length && columns[0].x < -CAP_W) columns.shift();
      const last = columns[columns.length - 1];
      if (last && last.x < W - SPACING) spawnColumn(last.x + SPACING);

      // collision: forgiving box around Cameron's body
      const hb = { x: CAT_X - 15, y: cat.y - 8, w: 31, h: 16 };
      for (const col of columns) {
        const bot = col.top + GAP;
        const rects = [
          [col.x, 0, COL_W, col.top - CAP_H],
          [col.x - 6, col.top - CAP_H, CAP_W, CAP_H],
          [col.x, bot + CAP_H, COL_W, FLOOR - bot],
          [col.x - 6, bot, CAP_W, CAP_H],
        ];
        for (const [rx, ry, rw, rh] of rects) {
          if (hb.x < rx + rw && hb.x + hb.w > rx && hb.y < ry + rh && hb.y + hb.h > ry) { die(); break; }
        }
        if (state !== 'play') break;
      }
    }
    if (flash > 0) flash = Math.max(0, flash - dt * 4);
  }

  // ---------- Render ----------
  function drawText(str, x, y, size) {
    ctx.font = `${size}px "Press Start 2P", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = C.outline;
    for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2], [2, 2], [3, 3]]) ctx.fillText(str, x + dx, y + dy);
    ctx.fillStyle = '#fffbe9';
    ctx.fillText(str, x, y);
  }

  function render() {
    const bx = -Math.floor(bgX);
    for (let x = bx; x < W; x += TILE) ctx.drawImage(bg, x, 0);

    for (const col of columns) drawColumn(Math.round(col.x), Math.round(col.top), Math.round(col.top + GAP));

    ctx.drawImage(floorImg, -Math.floor(floorX), FLOOR);

    // Cameron
    ctx.save();
    if (cat.landed) {
      // standing on the floor, with a little squash on touchdown
      const squash = 0.2 * Math.max(0, 1 - cat.landT * 5);
      ctx.translate(CAT_X, FLOOR + 1);
      ctx.scale(CAT_SCALE * (1 + squash * 0.5), CAT_SCALE * (1 - squash));
      ctx.drawImage(catSprites[2], -CAT_W / 2, -CAT_H);
    } else {
      ctx.translate(CAT_X, Math.round(cat.y));
      ctx.rotate(cat.rot);
      ctx.scale(CAT_SCALE, CAT_SCALE);
      ctx.drawImage(catSprites[state === 'play' && cat.vy < 0 ? 0 : cat.frame], -CAT_W / 2, -CAT_H / 2);
    }
    ctx.restore();

    if (state === 'play' || state === 'dying' || state === 'over-pending') drawText(String(score), W / 2, 56, 24);

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,251,233,${flash})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ---------- Input ----------
  ui.game.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    handleInput();
  });
  window.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) handleInput();
    }
    if (e.code === 'KeyM') ui.mute.click();
  });
  ui.again.addEventListener('click', () => { if (state === 'over') reset(); });
  ui.mute.addEventListener('click', e => {
    muted = !muted;
    store.set('cameron-muted', muted ? '1' : '0');
    syncMute();
    e.currentTarget.blur();
  });

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
